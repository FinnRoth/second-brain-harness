[project]
name = "second-brain-harness"
version = "0.2.0"
description = "Persönlicher KI-Assistent mit Langzeitgedächtnis und MCP – Backend für Open WebUI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "mcp>=2.3,<3",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "markitdown[docx,pptx,xlsx,xls]>=0.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyflakes>=3"]

[tool.uv]
package = false
