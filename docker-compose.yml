services:
  harness:
    build: .
    container_name: second-brain-harness
    env_file: .env
    environment:
      DB_PATH: /data/brain.db
      EXPORT_DIR: /vault
    volumes:
      - ./data:/data     # SQLite-Datenbank (dein Gedächtnis – regelmäßig sichern!)
      - ./vault:/vault   # Obsidian-Vault (Markdown-Export)
    ports:
      - "8100:8000"      # Admin-API: http://localhost:8100/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      - harness
    ports:
      - "3000:8080"
    environment:
      # Gilt nur beim allerersten Start; danach in Open WebUI unter
      # Admin-Einstellungen → Verbindungen änderbar.
      OPENAI_API_BASE_URL: http://harness:8000/v1
      OPENAI_API_KEY: ${HARNESS_API_KEY}
      ENABLE_OLLAMA_API: "false"
      # Schickt die Chat-ID mit → der Harness kann Chats sauber zuordnen
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui:
